<div class="container">
  <div class="row">
    <div class="col-12">
      <button *ngIf="isLoggedIn()" class="btn btn-primary mb-3" 
        (click)="addTrip()">Add Trip</button>
    </div>
  </div>
  <div class="row">
    @for (trip of trips; track trip.code) {
      <app-trip-card
        [trip]="trip"
        (tripDeleted)="getTrips()"
        class="col-md-4 mt-2">
      </app-trip-card>
    }
  </div>
</div>
