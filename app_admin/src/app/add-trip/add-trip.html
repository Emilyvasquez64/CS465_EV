<div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <h2 class="text-center mt-4">Add Trip</h2>
        <form *ngIf="addForm" [formGroup]="addForm" (ngSubmit)="onSubmit()">
  
          <div class="form-group mb-2">
            <label>Code:</label>
            <input type="text" formControlName="code" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">
            <div *ngIf="submitted && f['code'].errors?.['required']" class="invalid-feedback">
              Trip Code is required
            </div>
          </div>
  
          <div class="form-group mb-2">
            <label>Name:</label>
            <input type="text" formControlName="name" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
            <div *ngIf="submitted && f['name'].errors?.['required']" class="invalid-feedback">
              Name is required
            </div>
          </div>
  
          <div class="form-group mb-2">
            <label>Length:</label>
            <input type="text" formControlName="length" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
            <div *ngIf="submitted && f['length'].errors?.['required']" class="invalid-feedback">
              Length is required
            </div>
          </div>
  
          <div class="form-group mb-2">
            <label>Start Date:</label>
            <input type="date" formControlName="start" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
            <div *ngIf="submitted && f['start'].errors?.['required']" class="invalid-feedback">
              Date is required
            </div>
          </div>
  
          <div class="form-group mb-2">
            <label>Resort:</label>
            <input type="text" formControlName="resort" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
            <div *ngIf="submitted && f['resort'].errors?.['required']" class="invalid-feedback">
              Resort is required
            </div>
          </div>
  
          <div class="form-group mb-2">
            <label>Per Person:</label>
            <input type="text" formControlName="perPerson" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
            <div *ngIf="submitted && f['perPerson'].errors?.['required']" class="invalid-feedback">
              Per Person is required
            </div>
          </div>
  
          <div class="form-group mb-2">
            <label>Image Name:</label>
            <input type="text" formControlName="image" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
            <div *ngIf="submitted && f['image'].errors?.['required']" class="invalid-feedback">
              Image Name is required
            </div>
          </div>
  
          <div class="form-group mb-3">
            <label>Description:</label>
            <input type="text" formControlName="description" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['description'].errors }">
            <div *ngIf="submitted && f['description'].errors?.['required']" class="invalid-feedback">
              Description is required
            </div>
          </div>
  
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary ms-2" 
          (click)="router.navigate([''])">Cancel</button>
        </form>
      </div>
    </div>
  </div>
